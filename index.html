<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<aside id="panel">
  <header class="panel-head">
    <h1>Mockup Studio</h1>
    <button id="btn-reset" class="ghost" title="Reset every setting to defaults">Reset all</button>
  </header>

  <div id="controls"></div>

  <footer class="panel-foot">
    <div class="export-opts">
      <label for="exp-scale">Quality</label>
      <select id="exp-scale">
        <option value="1">1x — fast</option>
        <option value="2" selected>2x — crisp</option>
      </select>
      <label for="exp-preset">Encode</label>
      <select id="exp-preset">
        <option value="medium" selected>medium</option>
        <option value="slow">slow</option>
        <option value="veryfast">veryfast</option>
      </select>
    </div>

    <button id="btn-export" class="primary">Export video</button>

    <div id="export-live" hidden>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
      <div class="status-row">
        <span id="export-msg">Starting…</span>
        <button id="btn-cancel" class="ghost">Cancel</button>
      </div>
    </div>

    <div id="export-result" hidden></div>
  </footer>
</aside>

<div id="splitter" title="Drag to resize"></div>

<main id="viewport">
  <div id="fit">
    <div id="stage">
      <div id="world">
        <div class="shadow" data-shadow="a"></div>
        <div class="shadow" data-shadow="b"></div>

        <div class="phone" data-phone="a">
          <div class="phone-body">
            <div class="phone-rail"></div>
            <div class="phone-screen">
              <video data-video="a" muted playsinline preload="auto"></video>
              <canvas data-canvas="a" class="screen-canvas"></canvas>
              <div class="notch"></div>
              <div class="glare"></div>
              <button class="screen-drop" type="button" title="Choose a video or image">
                <span class="plus" aria-hidden="true">+</span>
                <span class="drop-label">Add footage</span>
              </button>
            </div>
          </div>
        </div>

        <div class="phone" data-phone="b">
          <div class="phone-body">
            <div class="phone-rail"></div>
            <div class="phone-screen">
              <video data-video="b" muted playsinline preload="auto"></video>
              <canvas data-canvas="b" class="screen-canvas"></canvas>
              <div class="notch"></div>
              <div class="glare"></div>
              <button class="screen-drop" type="button" title="Choose a video or image">
                <span class="plus" aria-hidden="true">+</span>
                <span class="drop-label">Add footage</span>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div id="vignette"></div>
    </div>
  </div>

  <div id="transport">
    <button id="btn-play" class="play">Play</button>
    <span class="time" id="time-label">0.00 / 18.00s</span>
    <input type="range" id="scrub" min="0" max="18" step="0.01" value="0">
    <span class="dim" id="fit-label"></span>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
